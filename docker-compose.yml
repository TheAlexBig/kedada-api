services:
  postgres:
    image: postgres:17
    container_name: kedada-postgres
    environment:
      POSTGRES_DB: kedada
      POSTGRES_USER: kedada
      POSTGRES_PASSWORD: kedada
    ports:
      - "5432:5432"
    volumes:
      - kedada-postgres17-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kedada -d kedada"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: kedada-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kedada
      MINIO_ROOT_PASSWORD: kedada-local-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - kedada-minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 kedada kedada-local-secret; do sleep 1; done;
      mc mb --ignore-existing local/kedada-media;
      "

volumes:
  kedada-postgres17-data:
  kedada-minio-data:
