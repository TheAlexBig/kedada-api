spring:
  application:
    name: kedada-api
  profiles:
    active: local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

kedada:
  security:
    jwt:
      expiration-seconds: 86400
  storage:
    s3:
      signed-url-expiration-seconds: 900
      max-upload-bytes: 5242880

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/kedada
    username: kedada
    password: kedada
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

kedada:
  security:
    jwt:
      secret: local-development-secret-change-before-deploying
  storage:
    s3:
      bucket: kedada-media
      region: us-east-1
      endpoint: http://localhost:9000
      public-endpoint: http://localhost:9000
      access-key: kedada
      secret-key: kedada-local-secret
      path-style-access-enabled: true

logging:
  level:
    org.hibernate.SQL: debug

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:postgresql://localhost:5432/kedada_test
    username: kedada
    password: kedada
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

kedada:
  security:
    jwt:
      secret: test-development-secret-change-before-deploying
  storage:
    s3:
      bucket: kedada-media-test
      region: us-east-1
      endpoint: http://localhost:9000
      public-endpoint: http://localhost:9000
      access-key: kedada
      secret-key: kedada-local-secret
      path-style-access-enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

kedada:
  security:
    jwt:
      secret: ${JWT_SECRET}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${S3_REGION:us-east-1}
      endpoint: ${S3_ENDPOINT:}
      public-endpoint: ${S3_PUBLIC_ENDPOINT:}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      path-style-access-enabled: ${S3_PATH_STYLE_ACCESS_ENABLED:false}
